<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe — Aura Collect</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236B4BFF'/%3E%3Cpath d='M9 23l7-15 7 15' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12.5 18.5h7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/aura.css?v=11">
<style>
  .reset{max-width:440px;margin:0 auto;padding:64px 22px 80px}
  .reset h1{font-size:26px;letter-spacing:-.02em;margin:18px 0 8px}
  .reset p.lede{color:var(--ink-2);font-size:14.5px;line-height:1.6;margin:0 0 26px}
  .reset label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  .reset input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;box-sizing:border-box}
  .reset input:focus{outline:2px solid var(--brand);outline-offset:1px}
  .reset button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .reset button[disabled]{opacity:.6;cursor:default}
  .msg{margin-top:16px;font-size:13.5px;line-height:1.5;padding:11px 13px;border-radius:9px;display:none}
  .msg.err{display:block;background:#FDECEC;color:#8E2020}
  .msg.ok{display:block;background:#E9F7EF;color:#1E6B3A}
  .reset .alt{margin-top:22px;font-size:13px;color:var(--ink-3);text-align:center}
  .reset .alt a{color:var(--brand);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="reset">
  <a class="brand" href="index.html" style="font-size:14px">
    <span class="brand__mark" style="width:28px;height:28px;flex:0 0 28px;font-size:13px">A</span>
    <span>Aura Collect</span>
  </a>

  <h1>Nouveau mot de passe</h1>
  <p class="lede">Choisissez un mot de passe de 8 caractères minimum. Le lien ne sert qu'une fois.</p>

  <form id="form" autocomplete="off">
    <label for="next">Nouveau mot de passe</label>
    <input id="next" name="next" type="password" minlength="8" required autocomplete="new-password">
    <label for="confirm" style="margin-top:14px">Confirmez</label>
    <input id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password">
    <button id="go" type="submit">Enregistrer</button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="alt">Le lien a expiré ? <a href="app.html">Demandez-en un nouveau</a>.</p>
</div>

<script>
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  function dit(texte, type) {
    msg.className = 'msg ' + type;
    msg.textContent = texte;
  }

  if (!token) dit('Lien incomplet. Ouvrez le lien transmis par votre cabinet.', 'err');

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var next = document.getElementById('next').value;
    var confirm = document.getElementById('confirm').value;
    if (next !== confirm) return dit('Les deux mots de passe diffèrent.', 'err');
    if (next.length < 8) return dit('8 caractères minimum.', 'err');

    go.disabled = true;
    fetch('/api/password/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, next: next })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { go.disabled = false; return dit(res.d.error || 'Réinitialisation impossible.', 'err'); }
        dit('Mot de passe enregistré. Vous pouvez vous connecter.', 'ok');
        setTimeout(function () { location.href = '/app?login=1'; }, 1600);
      })
      .catch(function () { go.disabled = false; dit('Réseau indisponible. Réessayez.', 'err'); });
  });
</script>
</body>
</html>
