<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe — Aura Collect</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236B4BFF'/%3E%3Cpath d='M9 23l7-15 7 15' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12.5 18.5h7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/aura.css?v=11">
<link rel="stylesheet" href="assets/css/app.css?v=15">
<style>
  .reset .msg{display:none}
  .reset .msg.err,.reset .msg.ok{display:block}
</style>
</head>
<body class="admin is-solo">
<main class="reset solo">
  <a class="brand solo__brand" href="index.html">
    <span class="brand__mark" style="width:28px;height:28px;flex:0 0 28px;font-size:13px">A</span>
    <span>Aura Collect</span>
  </a>

  <div class="solo__card">
  <h1>Nouveau mot de passe</h1>
  <p class="lede">Choisissez un mot de passe de 8 caractères minimum. Le lien ne sert qu'une fois.</p>

  <form id="form" autocomplete="off">
    <div class="field"><label for="next">Nouveau mot de passe</label>
    <input id="next" name="next" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="field"><label for="confirm">Confirmez</label>
    <input id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password"></div>
    <button id="go" class="btn btn--primary btn--block" type="submit">Enregistrer</button>
    <div class="msg solo__msg" id="msg"></div>
  </form>

  <p class="alt">Le lien a expiré ? <a href="app?login=1">Demandez-en un nouveau</a> avec « Mot de passe oublié ».</p>
  </div>
</main>

<script>
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  function dit(texte, type) {
    msg.className = 'msg ' + type;
    msg.textContent = texte;
  }

  if (!token) dit('Lien incomplet. Ouvrez le lien transmis par votre cabinet.', 'err');

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var next = document.getElementById('next').value;
    var confirm = document.getElementById('confirm').value;
    if (next !== confirm) return dit('Les deux mots de passe diffèrent.', 'err');
    if (next.length < 8) return dit('8 caractères minimum.', 'err');

    go.disabled = true;
    fetch('/api/password/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, next: next })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { go.disabled = false; return dit(res.d.error || 'Réinitialisation impossible.', 'err'); }
        dit('Mot de passe enregistré. Vous pouvez vous connecter.', 'ok');
        setTimeout(function () { location.href = '/app?login=1'; }, 1600);
      })
      .catch(function () { go.disabled = false; dit('Réseau indisponible. Réessayez.', 'err'); });
  });
</script>
</body>
</html>
