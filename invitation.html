<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejoindre un cabinet — Aura Collect</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/aura.css">
<style>
  .inv{max-width:460px;margin:0 auto;padding:60px 20px 80px}
  .inv__card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}
  .inv h1{font-size:22px;letter-spacing:-.03em;margin:0 0 8px}
  .inv__sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px}
  .inv__who{background:#F7F6FF;border:1px solid #E4DEFF;border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:18px}
  .inv__who b{display:block;font-size:13px;margin-bottom:2px}
  .msg{font-size:12.5px;padding:10px 12px;border-radius:9px;display:none;margin-bottom:14px}
  .msg.is-on{display:block}
  .msg--err{background:#FDECEF;color:#B3253F;border:1px solid #F6CFD7}
</style>
</head>
<body>
<main class="inv">
  <div class="inv__card">
    <h1>Rejoindre le cabinet</h1>
    <p class="inv__sub" id="sub">Vérification de l'invitation…</p>

    <div class="inv__who" id="who" style="display:none">
      <b id="cabinetName"></b>
      <span id="whoEmail"></span>
    </div>

    <div class="msg" id="msg"></div>

    <form id="form" style="display:none">
      <div class="field" style="margin-bottom:12px">
        <label for="nom">Votre nom</label>
        <input id="nom" type="text" autocomplete="name" placeholder="Prénom et nom" required>
      </div>
      <div class="field" style="margin-bottom:12px">
        <label for="mdp">Choisissez votre mot de passe</label>
        <input id="mdp" type="password" autocomplete="new-password" minlength="8" placeholder="8 caractères minimum" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="btn" style="margin-top:8px">Créer mon accès</button>
    </form>

    <p class="inv__sub" style="margin:18px 0 0;font-size:11.5px">Vous garderez votre propre mot de passe. Chaque geste que vous ferez portera votre nom dans le journal des décisions du cabinet.</p>
  </div>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t');

function message(text) {
  $('msg').textContent = text;
  $('msg').className = 'msg is-on msg--err';
}

async function boot() {
  if (!token) { $('sub').textContent = 'Lien incomplet.'; message('Ce lien ne contient pas d\'invitation.'); return; }
  try {
    const r = await fetch('/api/invitation/' + encodeURIComponent(token));
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('sub').textContent = 'Invitation indisponible'; message(d.error || 'Invitation invalide.'); return; }
    $('sub').textContent = 'Vous avez été invité à rejoindre cet espace.';
    $('cabinetName').textContent = d.cabinet || 'Cabinet';
    $('whoEmail').textContent = d.email;
    $('nom').value = d.name || '';
    $('who').style.display = 'block';
    $('form').style.display = 'block';
  } catch (e) {
    $('sub').textContent = 'Connexion impossible';
    message('Réessayez dans un instant.');
  }
}

$('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  $('btn').disabled = true;
  try {
    const r = await fetch('/api/invitation/' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('nom').value.trim(), password: $('mdp').value })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { message(d.error || 'Erreur ' + r.status); $('btn').disabled = false; return; }
    location.href = '/app?bienvenue=1';
  } catch (err) {
    message('Réessayez dans un instant.');
    $('btn').disabled = false;
  }
});

boot();
</script>
</body>
</html>
