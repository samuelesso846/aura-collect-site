name: Mesure de l'IA
# À lancer à la main : Actions > Mesure de l'IA > Run workflow.
# Nécessite le secret GROQ_API_KEY (Settings > Secrets and variables > Actions).
# N'utilise que des documents fictifs générés à la volée ; aucune donnée réelle.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle Groq (vide = modèle de production)"
        required: false
        default: ""
      ids:
        description: "Cas à rejouer, séparés par des virgules (vide = tous)"
        required: false
        default: ""
      repeat:
        description: "Nombre de passages par cas"
        required: false
        default: "1"
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install pillow numpy reportlab
      - run: python3 tests/ai-eval/make_corpus.py corpus
      - name: Mesure
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.model }}
          EVAL_IDS: ${{ inputs.ids }}
          EVAL_REPEAT: ${{ inputs.repeat }}
        run: node tests/ai-eval/run.js corpus results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesure-ia
          path: |
            results/
            corpus/
